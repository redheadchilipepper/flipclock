<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .clock {
      display: flex;
      gap: 3.5vw;
      padding: 2vw;
    }

    .flip-card {
      position: relative;
      background-color: #1c1c1c;
      border-radius: 4.5vw;
      width: 42vw;
      max-width: 420px;
      height: 52vw;
      max-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65), 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .flip-card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      background-color: #0e0e0e;
      box-shadow: 0 1px 2px rgba(255, 255, 255, 0.04);
      z-index: 5;
    }

    .digits {
      font-size: 38vw;
      max-font-size: 380px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #dfdfdf;
      line-height: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 1000px) {
      .digits {
        font-size: 380px;
      }
    }

    .am-pm {
      position: absolute;
      top: 7%;
      left: 7%;
      font-size: 4.2vw;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #cfcfcf;
      z-index: 10;
    }

    @media (min-width: 1000px) {
      .am-pm {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>

  <div class="clock">
    <!-- Hour Card -->
    <div class="flip-card">
      <span class="am-pm" id="ampm">AM</span>
      <span class="digits" id="hours">12</span>
    </div>

    <!-- Minute Card -->
    <div class="flip-card">
      <span class="digits" id="minutes">34</span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      let rawHours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, "0");

      const ampm = rawHours >= 12 ? "PM" : "AM";
      const displayHours = rawHours % 12 || 12;

      document.getElementById("hours").textContent = String(displayHours).padStart(2, "0");
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("ampm").textContent = ampm;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
